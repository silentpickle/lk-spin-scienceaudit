sections_p_star_days = [3.0, 3.8, 4.7, 5.5, 7.5, 9.0, 12.0, 30.0]   # task (b): 8 values spanning 3-30 d. Chosen after scan (a) at 87 deg: FTLE > 0.02 at 3.0, 4.7, 7.5 and 9.0 d; regular (FTLE < 1e-3) at 3.8, 5.5, 12 and 30 d
sections_n_p0 = 20             # task (b): 20 p0 values x 2 phi0 = 40 initial conditions
sections_p0_max = 0.98         # task (b)
sections_n_cycles = 800        # task (b)
omega_n_max0 = [0.3, 0.7, 1.5] # task (c)
omega_theta_range_deg = [85.0, 89.9]   # task (c)
omega_n_theta = 40             # task (c)
validate_theta_lb0_deg = 85.0  # task validation: the step 3 analytic orbit (S15 Fig. 12), SRFs off
validate_eps_range = [0.008, 1.0]   # S15 Fig. 12 range (as results/step3/bifurcation_fig12.npz)
validate_n_eps = 200           # ASSUMED
validate_spread_cycles = 250   # ASSUMED: step 3 data has 500 cycles; spread over the last half, as the task's last-500-of-1000 rule
rtol = 1e-10                   # [step4] production tolerance
atol = 1e-12                   # [step4] production tolerance
n_procs = 14                   # task
results = "results/prep_sq4"

